{% load static %}<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}فرم‌ها — Pen LMS{% endblock %}</title>
<link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">
<style>
  :root {
    --surface: oklch(97% 0 0);
    --surface-raised: oklch(100% 0 0);
    --accent: oklch(52% 0.18 250);
    --text-body: oklch(18% 0 0);
    --text-muted: oklch(50% 0 0);
    --border: oklch(88% 0 0);
  }
  body { font-family: Vazirmatn, system-ui, sans-serif; color: var(--text-body); background: var(--surface); }
  .forms-wrap { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem; }
  .forms-card { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
  .forms-field { margin-bottom: 1rem; }
  .forms-field label { display: block; font-weight: 600; margin-bottom: .35rem; }
  .forms-field .help { color: var(--text-muted); font-size: .85rem; margin-top: .25rem; }
  .forms-field input[type=text], .forms-field input[type=number], .forms-field input[type=date],
  .forms-field input[type=datetime-local], .forms-field input[type=time], .forms-field select,
  .forms-field textarea { width: 100%; padding: .5rem .65rem; border: 1px solid var(--border); border-radius: 6px; font: inherit; background: var(--surface-raised); color: var(--text-body); }
  .forms-field .errors { color: var(--danger, #dc2626); font-size: .85rem; margin-top: .3rem; }
  .forms-badge { display: inline-block; padding: .15rem .55rem; border-radius: 999px; font-size: .78rem; border: 1px solid var(--border); }
  .forms-badge.draft { background: oklch(95% .02 250); }
  .forms-badge.submitted { background: oklch(93% .05 250); }
  .forms-badge.approved { background: oklch(93% .06 150); }
  .forms-badge.rejected { background: oklch(93% .06 25); }
  table.forms-table { width: 100%; border-collapse: collapse; }
  table.forms-table th, table.forms-table td { border: 1px solid var(--border); padding: .5rem .6rem; text-align: right; font-size: .9rem; }
  .forms-empty { text-align: center; color: var(--text-muted); padding: 2rem 0; }
  .forms-actions { display: flex; gap: .6rem; flex-wrap: wrap; }
  .btn-primary { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: .55rem 1.1rem; font: inherit; cursor: pointer; }
  .btn-secondary { background: var(--surface-raised); color: var(--text-body); border: 1px solid var(--border); border-radius: 6px; padding: .55rem 1.1rem; font: inherit; cursor: pointer; }
  .forms-error-summary { border: 1px solid var(--danger, #dc2626); background: oklch(95% .04 25); border-radius: 8px; padding: .8rem 1rem; margin-bottom: 1rem; }
  .forms-progress { display: flex; gap: .4rem; margin-bottom: 1rem; }
  .forms-progress span { flex: 1; height: 6px; border-radius: 3px; background: var(--border); }
  .forms-progress span.done { background: var(--accent); }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<div class="forms-wrap">
  <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
    <h1 style="font-size:1.25rem;margin:0;">{% block heading %}فرم‌ها{% endblock %}</h1>
    <div>
      <a class="btn-secondary" href="{% url 'submission-list' %}">فهرست فرم‌ها</a>
      <a class="btn-secondary" href="{% url 'dashboard-home' %}">داشبورد</a>
    </div>
  </header>
  {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
