{% load static %}<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود — Pen LMS</title>
<link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">
</head>
<body class="login-page">
<div class="login-card">
  <h1>📘 Pen LMS</h1>
  <p>سامانه مدیریت فرآیندها و آموزش</p>
  {% if form.errors %}
    <div class="error">نام کاربری یا رمز عبور اشتباه است.</div>
  {% endif %}
  <form method="post" action="{% url 'dashboard-login' %}">
    {% csrf_token %}
    <div class="form-group">
      <label>نام کاربری</label>
      <input type="text" name="username" required autofocus>
    </div>
    <div class="form-group">
      <label>رمز عبور</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%">ورود</button>
  </form>
</div>
</body>
</html>
