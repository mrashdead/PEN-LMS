{% load static %}<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Pen LMS{% endblock %}</title>
<link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span>Pen LMS</span></div>
    <nav>
      <a href="#" data-page="home" class="active"><span>داشبورد</span></a>
      <a href="#" data-page="persons"><span>اشخاص</span></a>
      <a href="#" data-page="workflow"> <span>فرآیندها</span></a>
      <a href="#" data-page="tasks"><span>وظایف</span></a>
      <a href="#" data-page="academics"> <span>آموزش</span></a>
    </nav>
    <div class="user-info">
      <div class="user-name">{{ request.user.get_full_name|default:request.user.username }}</div>
      <form id="logout-form" method="post" action="{% url 'dashboard-logout' %}">
        {% csrf_token %}
        <button type="submit" class="logout-btn">خروج</button>
      </form>
    </div>
  </aside>
  <main class="main" id="page-content">
    {% block content %}{% endblock %}
  </main>
</div>
<script src="{% static 'dashboard/js/api.js' %}?v=2"></script>
<script src="{% static 'dashboard/js/app.js' %}?v=2"></script>
</body>
</html>
