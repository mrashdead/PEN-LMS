{% load static asset_v %}<!DOCTYPE html>
<html lang="fa" dir="rtl" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}بازیابی رمز عبور{% endblock %} | Pen LMS</title>
  <link href="{% static 'assets/css/bootstrap.rtl.css' %}" rel="stylesheet" type="text/css">
  <link href="{% static 'assets/css/icons.rtl.css' %}" rel="stylesheet" type="text/css">
  <link href="{% static 'assets/css/font-face.css' %}" rel="stylesheet" type="text/css">
  <link href="{% static 'assets/css/app.rtl.css' %}" rel="stylesheet" type="text/css">
  <link href="{% static 'assets/css/custom.css' %}" rel="stylesheet" type="text/css">
  <link href="{% asset_v_url 'assets/pen/css/pen.css' %}" rel="stylesheet" type="text/css">
</head>
<body>
<div class="auth-wrapper">
  <div class="container min-vh-100 py-10 d-flex align-items-center">
    <div class="w-100">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-7 col-xl-6 col-xxl-5">
          <div class="card mb-0">
            <div class="p-sm-8 p-md-10 card-body">
              <div class="text-center mb-4">
                <a href="{% url 'dashboard-login' %}" class="logos">
                  <img src="{% static 'assets/images/main-logo.png' %}" loading="lazy" alt="Pen LMS" class="h-8 logo-dark">
                  <img src="{% static 'assets/images/logo-white.png' %}" loading="lazy" alt="Pen LMS" class="h-8 logo-light">
                </a>
              </div>
              <h4 class="mb-2 text-gradient fw-bold text-center">{% block heading %}بازیابی رمز عبور{% endblock %}</h4>
              {% block content %}{% endblock %}
            </div>
          </div>
          <div class="text-center mt-4 text-muted fs-13">با یادآوری رمز، <a href="{% url 'dashboard-login' %}" class="link-primary">به صفحهٔ ورود برگردید</a>.</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="{% static 'assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'assets/libs/lucide/dist/umd/lucide.min.js' %}"></script>
<script>window.addEventListener('load', function () { if (window.lucide) lucide.createIcons(); });</script>
</body>
</html>
