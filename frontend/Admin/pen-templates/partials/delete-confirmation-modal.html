<div class="modal fade" id="pen-delete-modal" tabindex="-1" aria-labelledby="pen-delete-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header">
        <h5 class="modal-title d-flex align-items-center gap-2" id="pen-delete-title">
          <i data-lucide="triangle-alert" class="size-5 text-danger" aria-hidden="true"></i>
          تأیید حذف نرم
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="بستن"></button>
      </div>
      <div class="modal-body">
        <p id="pen-delete-message" class="mb-2">آیا از حذف این رکورد اطمینان دارید؟</p>
        <p class="text-muted fs-14 mb-0">رکورد از فهرست فعال خارج می‌شود و فقط مدیر سیستم می‌تواند آن را بازیابی کند.</p>
        <div id="pen-delete-error" class="alert alert-danger mt-3 mb-0" role="alert" hidden></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">انصراف</button>
        <button type="button" class="btn btn-danger" id="pen-delete-confirm">
          <i data-lucide="trash-2" class="size-4 me-1" aria-hidden="true"></i> حذف و غیرفعال‌سازی
        </button>
      </div>
    </div>
  </div>
</div>
